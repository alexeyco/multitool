name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "Tag $TAG_NAME does not match package version $expected_tag" >&2
            exit 1
          fi

      - name: Verify tagged commit is on master
        env:
          TAG_COMMIT: ${{ github.sha }}
        run: git merge-base --is-ancestor "$TAG_COMMIT" origin/master

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: make check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish package with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
